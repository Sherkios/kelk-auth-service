services:
  auth:
    container_name: kelk-auth-app-container
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DATABASE_USER:-postgresql}:${DATABASE_PASSWORD:-password}@${DATABASE_HOST:-db}:${DATABASE_PORT:-5432}/${DATABASE_DB}?schema=public
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      - ./:/app
    depends_on:
      - db
    command: >
      sh -c "if [ \"$NODE_ENV\" = 'production' ]; then npm run build; npm run start:prod; else npm run start:dev; fi;"

  db:
    container_name: kelk-auth-db-container
    image: postgres:17-alpine
    env_file:
      - .env
    restart: always
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
